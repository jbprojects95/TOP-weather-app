<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Weather App</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Weather App</h1>
    </header>

    <main class="main-layout">
      <section class="main-grid-cell">
        <div class="weather-display">
          <div class="weather-img"><img src="/img/cloudy.svg" alt="" /></div>
          <div class="weather-location">
            <span class="title-span" id="weatherLocation"></span>
          </div>
          <div class="weather-data-list">
            <ul class="weather-list" id="weatherDash">
              <li class="weather-data-row">
                Temp
                <span id="temp"></span>
              </li>

              <li class="weather-data-row">
                Feels like
                <span id="feelsLike"></span>
              </li>

              <li class="weather-data-row">
                Humidity
                <span id="humidity"></span>
              </li>

              <li class="weather-data-row">
                Precipitation
                <span id="precipitation"></span>
              </li>
            </ul>
          </div>
        </div>
      </section>
      <!-- <section class="main-grid-cell form-section">

          Lorem ipsum dolor sit amet consectetur adipisicing elit. Nostrum,

          quas, optio iusto necessitatibus eius quidem blanditiis totam?
          Quaerat, aut adipisci.
        </p>
      </section> -->

    <footer>

  </body>
</html>
